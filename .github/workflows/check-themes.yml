# Vérifie chaque thème avec les règles du serveur ioDek. / Checks every theme with the ioDek server rules.
name: Check themes
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - working-directory: themes
        run: php scripts/check-theme.php themes/*.css exemple.css
